name: Validate Security Evidence

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-security-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install pyyaml

      - name: Validate repo structure
        run: python3 scripts/validate_repo_structure.py --repo-root .

      - name: Materialize workspace context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import yaml

          repo_root = Path(".").resolve()
          workspace_root = repo_root / ".workspace-ci"
          if workspace_root.exists():
              shutil.rmtree(workspace_root)
          workspace_root.mkdir()
          shutil.copytree(
              repo_root,
              workspace_root / "security-architecture",
              ignore=shutil.ignore_patterns(".git", ".workspace-ci", "__pycache__", "*.pyc"),
          )

          base_repos = {
              "workspace-governance",
              "platform-engineering",
              "openclaw-runtime-distribution",
              "openclaw-telegram-enhanced",
              "openclaw-host-bridge",
              "operator-orchestration-service",
          }

          def collect_referenced_repos(value):
              if isinstance(value, dict):
                  repo = value.get("repo")
                  path = value.get("path")
                  if isinstance(repo, str) and isinstance(path, str):
                      yield repo
                  for child in value.values():
                      yield from collect_referenced_repos(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from collect_referenced_repos(child)

          registers = [
              "registers/review-inventory.yaml",
              "registers/remediation-inventory.yaml",
          ]
          referenced_repos = set()
          for rel_path in registers:
              data = yaml.safe_load((repo_root / rel_path).read_text()) or {}
              referenced_repos.update(collect_referenced_repos(data))

          repos = sorted((base_repos | referenced_repos) - {"security-architecture"})
          for repo_name in repos:
              subprocess.run(
                  [
                      "git",
                      "clone",
                      "--depth",
                      "1",
                      f"https://github.com/mfshaf7/{repo_name}.git",
                      str(workspace_root / repo_name),
                  ],
                  check=True,
              )
          PY

      - name: Validate security evidence
        run: python3 .workspace-ci/security-architecture/scripts/validate_security_evidence.py --repo-root .workspace-ci/security-architecture --workspace-root .workspace-ci
